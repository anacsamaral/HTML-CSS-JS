<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validação de Cadastro com Floating Labels</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Estilos básicos para centralizar e dar destaque ao formulário */
        body {
            background-color: #f8f9fa;
        }
        .login-box {
            max-width: 400px;
            margin: 10vh auto;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            background-color: #ffffff;
        }
        /* Cor de feedback para erro (vermelho) */
        .text-error {
            color: #dc3545 !important;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="login-box">
            <h3 class="text-center mb-4">Crie sua Conta</h3>
            
            <form id="cadastroForm" class="row g-3">
                
                <div class="col-12">
                    <div class="form-floating">
                        <input type="text" class="form-control" id="inputLogin" placeholder="Mínimo 8 caracteres">
                        <label for="inputLogin">Nome de Usuário (Login)</label>
                    </div>
                </div>

                <div class="col-12">
                    <div class="form-floating">
                        <input type="password" class="form-control" id="inputSenha" placeholder="Senha">
                        <label for="inputSenha">Senha</label>
                    </div>
                    <small id="senhaHelp" class="form-text text-muted">
                        Mín. 6 caracteres, 1 Maiúscula, 1 Número, 1 Caracter Especial.
                    </small>
                </div>

                <div class="col-12">
                    <div class="form-floating">
                        <input type="password" class="form-control" id="inputConfirmaSenha" placeholder="Confirmar Senha">
                        <label for="inputConfirmaSenha">Confirmar Senha</label>
                    </div>
                </div>

                <div class="col-12 mt-4">
                    <p id="resultado" style="display: none; font-weight: bold;" class="text-center"></p>
                </div>

                <div class="col-12 d-grid gap-2">
                    <button type="button" class="btn btn-primary" id="btnCriarConta">
                        Criar Conta
                    </button>
                </div>

            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // 1. Obtenção dos Elementos do DOM
        const inputLogin = document.getElementById('inputLogin');
        const inputSenha = document.getElementById('inputSenha');
        const inputConfirmaSenha = document.getElementById('inputConfirmaSenha');
        const btnCriarConta = document.getElementById('btnCriarConta');
        const resultadoP = document.getElementById('resultado');

        // Expressão Regular para Senha Forte:
        // (?=.*[A-Z])   -> Deve conter pelo menos 1 letra maiúscula
        // (?=.*[0-9])   -> Deve conter pelo menos 1 número
        // (?=.*[!@#$%^&*]) -> Deve conter pelo menos 1 caracter especial (lista customizável)
        // .{6,}         -> Deve ter 6 ou mais caracteres
        const regexSenhaForte = /^(?=.*[A-Z])(?=.*[0-9])(?=.*[!@#$%^&*()_+={}\[\]:;"'<>,.?\/\\-])(?=.{6,})/;


        // --- Função de Validação da Senha ---
        function validarSenha(senha) {
            return regexSenhaForte.test(senha);
        }

        // --- Função para Exibir Resultado ---
        function exibirResultado(mensagem, isSucesso) {
            resultadoP.textContent = mensagem;
            // Remove as classes de cor anteriores
            resultadoP.classList.remove('text-success', 'text-error');

            if (isSucesso) {
                resultadoP.classList.add('text-success'); // Cor padrão Bootstrap para sucesso
            } else {
                resultadoP.classList.add('text-error'); // Cor vermelha customizada no CSS
            }
            resultadoP.style.display = 'block';
        }

        // --- A) Evento de Click do Botão 'Criar Conta' ---
        btnCriarConta.addEventListener('click', function() {
            // Esconde o resultado ao iniciar uma nova validação
            resultadoP.style.display = 'none';
            
            const login = inputLogin.value;
            const senha = inputSenha.value;
            const confirmaSenha = inputConfirmaSenha.value;
            
            let mensagensErro = [];

            // 1. Validação do Login (mínimo 8 caracteres)
            if (login.length < 6) {
                mensagensErro.push("O login precisa conter no mínimo 8 caracteres.");
            }

            // 2. Validação de Senha Forte
            if (!validarSenha(senha)) {
                mensagensErro.push("A senha é fraca. Requisitos: min. 6 caracteres, 1 maiúscula, 1 número, 1 caracter especial.");
            }

            // 3. Validação de Senhas Iguais
            if (senha !== confirmaSenha) {
                mensagensErro.push("As senhas não são iguais.");
            }

            // Exibir o resultado final
            if (mensagensErro.length === 0) {
                exibirResultado("Conta criada com sucesso!", true); // Sucesso (cor padrão/verde)
            } else {
                // Junta todas as mensagens de erro com um separador
                exibirResultado(mensagensErro.join(" | "), false); // Erro (cor vermelha)
            }
        });

        // --- B) Evento keydown para esconder o resultado ---
        // Itera sobre os inputs e adiciona o mesmo listener
        [inputLogin, inputSenha, inputConfirmaSenha].forEach(input => {
            input.addEventListener('keydown', function() {
                // Esconde a tag <p> se ela estiver visível
                if (resultadoP.style.display !== 'none') {
                    resultadoP.style.display = 'none';
                }
            });
        });


        // --- C) Evento blur (perder foco) apenas para o input login ---
        inputLogin.addEventListener('blur', function() {
            const login = inputLogin.value;
            
            // Esconde o resultado antes de exibir um novo (para não acumular mensagens)
            resultadoP.style.display = 'none';

            if (login.length < 8 && login.length > 0) { // Verifica se tem menos de 8, mas não está vazio
                exibirResultado("Login precisa conter no mínimo 8 caracteres.", false); // Erro (cor vermelha)
            }
        });
    </script>
</body>
</html>
